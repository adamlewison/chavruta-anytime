services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chavruta
    ports:
      - "5432:5432"
    volumes:
      - chavruta-postgres-data:/var/lib/postgresql/data

volumes:
  chavruta-postgres-data:
